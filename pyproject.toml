[project]
name = "ticketing-api"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Rayhan", email = "rayhananthaakbar@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.basedpyright]
include = ["app"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportUnannotatedClassAttribute = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
